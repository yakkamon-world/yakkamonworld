# Sends a OneSignal push notification ("News alerts" bell subscribers) whenever
# a NEW post is added to posts.js on main. Runs alongside the chatbot-knowledge
# workflow; the two don't interact.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ONESIGNAL_APP_ID        — OneSignal → Settings → Keys & IDs → App ID
#   ONESIGNAL_REST_API_KEY  — same page → REST API Key
# Until both secrets exist the job logs "not configured" and exits green, so
# this file is safe to add before the OneSignal account is set up.
#
# Safety rails in the sender script:
#   - only slugs that are NEW compared to the commit before this push
#   - only posts dated within the last 3 days (so restoring an old backup of
#     posts.js can never blast out notifications for old articles)
#   - at most 3 notifications per push
# Re-running the workflow by hand from the Actions tab re-sends — don't re-run
# unless the first run failed before sending.
name: Send push notification for new posts

on:
  push:
    branches: [main]
    paths: ["posts.js"]
  workflow_dispatch:

concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    if: "!contains(github.event.head_commit.message, '(auto)')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Find new posts and send notifications
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/push-notify.mjs

