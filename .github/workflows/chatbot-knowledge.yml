# Rebuilds chatbot-knowledge.json AND the static copies of the JS-rendered hubs
# (news / home news / videos / FAQ, see build-static-hubs.mjs) whenever site
# content changes, and commits them back to main. Cloudflare's Git integration then deploys the fresh JSON and the
# chat worker picks it up within ten minutes.
#
# Needs: Settings → Actions → General → Workflow permissions → "Read and write".
# The [skip ci] in the commit message stops this workflow re-triggering itself.
name: Rebuild chatbot knowledge and static hubs

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "faq.js"
      - "gameplay.js"
      - "videos.js"
      - "posts.js"
      - "chatbot-digest.md"
      - "chatbot-official-posts.md"
      - "build-chatbot-knowledge.mjs"
      - "build-static-hubs.mjs"
  workflow_dispatch:

concurrency:
  group: chatbot-knowledge
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build static hubs (news, home news, videos, FAQ)
        run: node build-static-hubs.mjs
      - name: Build chatbot-knowledge.json
        run: node build-chatbot-knowledge.mjs
      - name: Commit if changed
        run: |
          git config user.name "yakkamonworld-bot"
          git config user.email "actions@users.noreply.github.com"
          FILES="chatbot-knowledge.json index.html news.html videos.html faq.html"
          if git diff --quiet -- $FILES; then
            echo "No change."
          else
            git add $FILES
            git commit -m "Rebuild chatbot knowledge and static hubs [skip ci]"
            git push
          fi
